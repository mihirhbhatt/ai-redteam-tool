<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title description">
  <title id="title">AI Red Team Assessment architecture</title>
  <desc id="description">The operator configures an assessment engine that runs tests against a model, evaluates responses, scores results, and generates reports for a dashboard. Optional judge, CVE lookup, and manual reporting workflows are also shown.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .node { fill: #f8fafc; stroke: #94a3b8; stroke-width: 1.5; }
      .primary { fill: #eff6ff; stroke: #60a5fa; }
      .secondary { fill: #f0fdf4; stroke: #86c99b; }
      .text { fill: #0f172a; font: 15px sans-serif; text-anchor: middle; }
      .small { fill: #475569; font: 12px sans-serif; text-anchor: middle; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2; marker-end: url(#arrow); }
      .optional { stroke-dasharray: 6 5; }
      .branch { fill: none; stroke: #64748b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1200" height="580" fill="#ffffff"/>

  <path class="edge" d="M180 130 H220"/>
  <path class="edge" d="M380 130 H420"/>
  <path class="edge" d="M580 130 H620"/>
  <path class="edge" d="M780 130 H820"/>
  <path class="edge" d="M980 130 H1020"/>
  <path class="edge" d="M1100 95 V48 H700 V95"/>
  <path class="edge" d="M700 165 V260"/>
  <path class="edge" d="M620 295 H580"/>
  <path class="edge" d="M420 295 H380"/>
  <path class="edge" d="M220 295 H180"/>
  <path class="edge optional" d="M780 295 H820"/>
  <path class="branch" d="M20 130 H8 V535 H700"/>
  <path class="edge" d="M8 475 H220"/>
  <path class="edge optional" d="M380 475 H420"/>
  <path class="edge" d="M700 535 V510"/>

  <rect class="node primary" x="20" y="95" width="160" height="70" rx="10"/>
  <text class="text" x="100" y="125"><tspan x="100">Operator</tspan><tspan x="100" dy="20">/ CLI</tspan></text>
  <rect class="node" x="220" y="95" width="160" height="70" rx="10"/>
  <text class="text" x="300" y="125"><tspan x="300">Configuration</tspan><tspan x="300" dy="20">and setup</tspan></text>
  <rect class="node" x="420" y="95" width="160" height="70" rx="10"/>
  <text class="text" x="500" y="125"><tspan x="500">Assessment</tspan><tspan x="500" dy="20">engine</tspan></text>
  <rect class="node primary" x="620" y="95" width="160" height="70" rx="10"/>
  <text class="text" x="700" y="125"><tspan x="700">Selected test</tspan><tspan x="700" dy="20">modules</tspan></text>
  <rect class="node" x="820" y="95" width="160" height="70" rx="10"/>
  <text class="text" x="900" y="135">Target adapters</text>
  <rect class="node secondary" x="1020" y="95" width="160" height="70" rx="10"/>
  <text class="text" x="1100" y="125"><tspan x="1100">Ollama or</tspan><tspan x="1100" dy="20">hosted model</tspan></text>

  <rect class="node" x="620" y="260" width="160" height="70" rx="10"/>
  <text class="text" x="700" y="290"><tspan x="700">Rule-based evaluator</tspan><tspan x="700" dy="20">or LLM judge</tspan></text>
  <rect class="node secondary" x="820" y="260" width="160" height="70" rx="10"/>
  <text class="text" x="900" y="290"><tspan x="900">Separate judge</tspan><tspan x="900" dy="20">adapter and model</tspan></text>
  <text class="small" x="900" y="250">Optional model request</text>
  <rect class="node" x="420" y="260" width="160" height="70" rx="10"/>
  <text class="text" x="500" y="300">Scoring</text>
  <rect class="node" x="220" y="260" width="160" height="70" rx="10"/>
  <text class="text" x="300" y="290"><tspan x="300">JSON / CSV / HTML</tspan><tspan x="300" dy="20">reports</tspan></text>
  <rect class="node primary" x="20" y="260" width="160" height="70" rx="10"/>
  <text class="text" x="100" y="290"><tspan x="100">Local read-only</tspan><tspan x="100" dy="20">dashboard</tspan></text>

  <rect class="node" x="220" y="440" width="160" height="70" rx="10"/>
  <text class="text" x="300" y="480">NVD CVE lookup</text>
  <rect class="node secondary" x="420" y="440" width="160" height="70" rx="10"/>
  <text class="text" x="500" y="470"><tspan x="500">NIST NVD</tspan><tspan x="500" dy="20">API</tspan></text>
  <text class="small" x="400" y="460">HTTPS</text>
  <rect class="node" x="620" y="440" width="160" height="70" rx="10"/>
  <text class="text" x="700" y="470"><tspan x="700">Manual engagement</tspan><tspan x="700" dy="20">and CVSS reporting</tspan></text>
</svg>
