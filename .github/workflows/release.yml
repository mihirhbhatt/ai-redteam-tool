name: Test and publish release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]*'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run tests
        run: python -m pytest -q

  build:
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onedir --name ai-redteam --hidden-import anthropic main.py
      - name: Smoke test executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\dist\ai-redteam\ai-redteam.exe --help
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\ai-redteam\ai-redteam.exe --list-providers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test executable (Linux)
        if: runner.os == 'Linux'
        run: |
          ./dist/ai-redteam/ai-redteam --help
          ./dist/ai-redteam/ai-redteam --list-providers
      - name: Stage release
        run: python scripts/package_release.py release/ai-redteam-${{ matrix.platform }}
      - name: Smoke test staged release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-Location release\ai-redteam-windows-x64
          & .\ai-redteam.exe --list-providers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\ai-redteam.exe --list
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test staged release (Linux)
        if: runner.os == 'Linux'
        run: |
          cd release/ai-redteam-linux-x64
          ./ai-redteam --list-providers
          ./ai-redteam --list
      - name: Archive Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path release\ai-redteam-windows-x64 -DestinationPath ai-redteam-windows-x64.zip
      - name: Archive Linux release
        if: runner.os == 'Linux'
        run: tar -C release -czf ai-redteam-linux-x64.tar.gz ai-redteam-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: ai-redteam-${{ matrix.platform }}
          path: ai-redteam-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish tagged GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            artifacts/ai-redteam-windows-x64.zip \
            artifacts/ai-redteam-linux-x64.tar.gz \
            --verify-tag --title "$RELEASE_TAG" --generate-notes
